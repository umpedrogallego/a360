<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A360 — Visualizador de Documentos</title>
  <!-- PDF.js da Mozilla -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #7c3aed;
      --primary-hover: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #202024;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--text);
      border-color: #3f3f46;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Barra de Ações */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #27272a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: #3f3f46;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-indicator, .zoom-indicator {
      font-size: 13px;
      color: var(--muted);
      min-width: 65px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Viewport Principal */
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      background-color: var(--bg);
      padding: 20px;
    }

    /* Container do PDF (Canvas) */
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .canvas-wrapper {
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
      display: inline-block;
    }

    canvas {
      display: block;
    }

    /* Container do PPTX (Iframe Office) */
    #pptx-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #18181b;
    }

    /* Status de Carregamento */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: var(--muted);
      display: none;
      background: rgba(24, 24, 27, 0.9);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchDoc(0)">
        <span class="tag">PDF</span> Apresentação VFX
      </button>
      <button class="tab-btn" onclick="switchDoc(1)">
        <span class="tag">PDF</span> DVR Passo a Passo
      </button>
      <button class="tab-btn" onclick="switchDoc(2)">
        <span class="tag">PPTX</span> Apresentação Slides
      </button>
    </div>

    <!-- Controles Dinâmicos -->
    <div class="controls" id="pdf-controls">
      <button class="btn" id="prev-page" onclick="changePage(-1)">‹ Anterior</button>
      <span class="page-indicator" id="page-num">1 / 1</span>
      <button class="btn" id="next-page" onclick="changePage(1)">Próxima ›</button>
      
      <div style="width: 1px; height: 18px; background: var(--border); margin: 0 4px;"></div>
      
      <button class="btn" onclick="adjustZoom(-0.2)">−</button>
      <span class="zoom-indicator" id="zoom-level">100%</span>
      <button class="btn" onclick="adjustZoom(0.2)">+</button>
      <button class="btn" onclick="resetZoom()">Reset</button>

      <a id="download-link" class="btn" style="text-decoration: none;" target="_blank" download>Baixar</a>
    </div>

    <div class="controls" id="pptx-controls" style="display: none;">
      <a id="pptx-download" class="btn" style="text-decoration: none;" target="_blank" download>Baixar .pptx</a>
    </div>
  </header>

  <main id="viewport">
    <div id="loading">Carregando arquivo...</div>
    
    <!-- Renderizador PDF -->
    <div id="pdf-container">
      <div class="canvas-wrapper">
        <canvas id="pdf-render"></canvas>
      </div>
    </div>

    <!-- Renderizador PPTX -->
    <iframe id="pptx-frame" allowfullscreen="true"></iframe>
  </main>

  <script>
    // Configura o worker do PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const baseUrl = 'https://umpedrogallego.github.io/a360/cadu/';
    
    const documents = [
      {
        type: 'pdf',
        title: 'A360 - Apresentação (PDF)',
        url: baseUrl + encodeURIComponent('A360 - Apresentação para aulas - Pós-produção VFX e Novas Tecnologias e DVR.pdf')
      },
      {
        type: 'pdf',
        title: 'DaVinci Resolve - Passo a Passo (PDF)',
        url: baseUrl + encodeURIComponent('LAB_DaVinciResolve_PassoAPasso_Revisado.pdf')
      },
      {
        type: 'pptx',
        title: 'A360 - Apresentação (PPTX)',
        url: baseUrl + encodeURIComponent('A360 - Apresentação para aulas - Pós-produção VFX e Novas Tecnologias e DVR.pptx')
      }
    ];

    let currentDocIndex = 0;
    let pdfDoc = null;
    let pageNum = 1;
    let currentScale = 1.2; // Escala lógica inicial
    let isRendering = false;
    let pageNumPending = null;

    // Elementos DOM
    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('loading');
    const pageNumEl = document.getElementById('page-num');
    const zoomLevelEl = document.getElementById('zoom-level');
    const downloadEl = document.getElementById('download-link');
    const pptxDownloadEl = document.getElementById('pptx-download');
    const pdfContainer = document.getElementById('pdf-container');
    const pptxFrame = document.getElementById('pptx-frame');
    const pdfControls = document.getElementById('pdf-controls');
    const pptxControls = document.getElementById('pptx-controls');
    const tabButtons = document.querySelectorAll('.tab-btn');

    // Renderização em Alta Resolução (Suporte a Telas Retina/HiDPI)
    function renderPage(num) {
      isRendering = true;
      pdfDoc.getPage(num).then(page => {
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: currentScale });

        // Ajusta o buffer interno do canvas para o pixel ratio da tela
        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);

        // Mantém a dimensão visual em CSS do tamanho exato da escala escolhida
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        const transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          isRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      pageNumEl.textContent = `${num} / ${pdfDoc.numPages}`;
      zoomLevelEl.textContent = `${Math.round(currentScale * 100)}%`;
      document.getElementById('prev-page').disabled = (num <= 1);
      document.getElementById('next-page').disabled = (num >= pdfDoc.numPages);
    }

    function queueRenderPage(num) {
      if (isRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function loadPdf(url) {
      loadingEl.style.display = 'block';
      pdfContainer.style.display = 'none';

      pdfjsLib.getDocument(url).promise.then(pdf => {
        pdfDoc = pdf;
        pageNum = 1;
        loadingEl.style.display = 'none';
        pdfContainer.style.display = 'flex';
        renderPage(pageNum);
      }).catch(err => {
        loadingEl.textContent = 'Erro ao carregar o arquivo PDF.';
        console.error(err);
      });
    }

    function switchDoc(index) {
      currentDocIndex = index;
      const doc = documents[index];

      tabButtons.forEach((btn, i) => btn.classList.toggle('active', i === index));

      if (doc.type === 'pdf') {
        pptxFrame.style.display = 'none';
        pptxFrame.src = '';
        pptxControls.style.display = 'none';
        pdfControls.style.display = 'flex';
        downloadEl.href = doc.url;
        loadPdf(doc.url);
      } else if (doc.type === 'pptx') {
        pdfContainer.style.display = 'none';
        pdfControls.style.display = 'none';
        pptxControls.style.display = 'flex';
        loadingEl.style.display = 'none';
        
        pptxDownloadEl.href = doc.url;
        // Office Online Web Viewer com HTTPS
        pptxFrame.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(doc.url)}`;
        pptxFrame.style.display = 'block';
      }
    }

    function changePage(delta) {
      if (!pdfDoc) return;
      if (pageNum + delta >= 1 && pageNum + delta <= pdfDoc.numPages) {
        pageNum += delta;
        queueRenderPage(pageNum);
      }
    }

    function adjustZoom(delta) {
      if (!pdfDoc) return;
      currentScale = Math.min(Math.max(currentScale + delta, 0.4), 4.0);
      queueRenderPage(pageNum);
    }

    function resetZoom() {
      if (!pdfDoc) return;
      currentScale = 1.0;
      queueRenderPage(pageNum);
    }

    // Teclas de atalho para PDF (← / → para páginas e Ctrl + / Ctrl - para zoom)
    window.addEventListener('keydown', (e) => {
      if (documents[currentDocIndex].type !== 'pdf') return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown') changePage(1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') changePage(-1);
      if (e.ctrlKey && (e.key === '+' || e.key === '=')) {
        e.preventDefault();
        adjustZoom(0.2);
      }
      if (e.ctrlKey && e.key === '-') {
        e.preventDefault();
        adjustZoom(-0.2);
      }
    });

    // Inicia na primeira aba
    switchDoc(0);
  </script>
</body>
</html>
